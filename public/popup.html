<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADHD Focus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 900px;
            min-height: 700px;
            background: #f3f4f6;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 16px;
        }

        #app-container {
            width: 100%;
            height: 100%;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 700px;
            color: #4b5eaa;
            font-size: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div class="loading">
            <span>🎯 Loading ADHD Focus...</span>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
